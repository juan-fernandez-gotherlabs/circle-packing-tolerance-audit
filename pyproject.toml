[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "circle-packing-tolerance-audit"
version = "1.0.0"
description = "Exact certificates and tolerance-aware audit for the n=26 variable-radius circle packing problem"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mpmath==1.3.0",
  "numpy==2.2.6",
  "scipy==1.17.1",
]

[tool.setuptools]
py-modules = []
