name: verify

on:
  push:
  pull_request:

jobs:
  exact-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.4"
          cache: pip
      - run: python -m pip install --requirement requirements.lock
      - run: ./verify_all.sh
      - run: git diff --exit-code
